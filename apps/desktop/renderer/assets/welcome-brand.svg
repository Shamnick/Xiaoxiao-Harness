<svg width="472" height="40" viewBox="0 0 472 40" fill="none" xmlns="http://www.w3.org/2000/svg">
<style>
  :root {
    --dsw-alias-label-primary: #0f1115;
    --dsw-alias-label-primary-inverted: #ffffff;
    --xx-accent: #5b5bf0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --dsw-alias-label-primary: #f4f6fa;
      --dsw-alias-label-primary-inverted: #0b0d11;
      --xx-accent: #8b8bf7;
    }
  }
</style>

<g transform="translate(96 2)">
  <!-- Brand mark: three concentric rings with a solid core. -->
  <circle cx="18" cy="18" r="14.5" stroke="var(--xx-accent)" stroke-width="2.6"/>
  <circle cx="18" cy="18" r="8" stroke="var(--xx-accent)" stroke-width="1.8" opacity="0.5"/>
  <circle cx="18" cy="18" r="3.2" fill="var(--xx-accent)"/>

  <!-- Product name -->
  <text x="44" y="26"
        fill="var(--dsw-alias-label-primary)"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', system-ui, sans-serif"
        font-size="25" font-weight="600" letter-spacing="-0.2">Xiaoxiao</text>

  <!-- Category badge -->
  <rect x="196" y="8" width="92" height="24" rx="5" fill="var(--dsw-alias-label-primary)"/>
  <text x="242" y="25"
        fill="var(--dsw-alias-label-primary-inverted)"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
        font-size="13" font-weight="700" letter-spacing="1.1"
        text-anchor="middle">HARNESS</text>
</g>
</svg>
