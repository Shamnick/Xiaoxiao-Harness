<svg width="620" height="64" viewBox="0 0 620 64" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="xx-mark" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#22d3ee"/>
    <stop offset="55%" stop-color="#7c7cf5"/>
    <stop offset="100%" stop-color="#c084fc"/>
  </linearGradient>
  <linearGradient id="xx-word" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="var(--dsw-alias-label-primary)"/>
    <stop offset="100%" stop-color="var(--dsw-alias-label-primary)" stop-opacity="0.72"/>
  </linearGradient>
  <filter id="xx-glow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
<style>
  :root {
    --dsw-alias-label-primary: #0d0f14;
    --dsw-alias-label-primary-inverted: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --dsw-alias-label-primary: #f6f8fc;
      --dsw-alias-label-primary-inverted: #0a0c10;
    }
  }
</style>
</defs>

<g transform="translate(96 4)">
  <!-- Mark: three concentric rings with a gradient stroke and a soft bloom. -->
  <g filter="url(#xx-glow)">
    <circle cx="28" cy="28" r="22" stroke="url(#xx-mark)" stroke-width="3.4"/>
    <circle cx="28" cy="28" r="12.5" stroke="url(#xx-mark)" stroke-width="2.2" opacity="0.55"/>
    <circle cx="28" cy="28" r="5" fill="url(#xx-mark)"/>
  </g>

  <!-- Wordmark in Montserrat, tight tracking for a designed look. -->
  <text x="70" y="40"
        fill="url(#xx-word)"
        font-family="Montserrat, -apple-system, system-ui, sans-serif"
        font-size="38" font-weight="500" letter-spacing="-0.5">Xiaoxiao</text>

  <!-- Category badge: solid pill, inverted label, wider optical tracking. -->
  <rect x="286" y="10" width="128" height="34" rx="7" fill="var(--dsw-alias-label-primary)"/>
  <text x="350" y="34"
        fill="var(--dsw-alias-label-primary-inverted)"
        font-family="Montserrat, -apple-system, system-ui, sans-serif"
        font-size="17" font-weight="500" letter-spacing="2.4"
        text-anchor="middle">HARNESS</text>
</g>
</svg>
